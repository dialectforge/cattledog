[workspace]
resolver = "2"
members = [
    "crates/df_core",
    "crates/graph",
    "crates/pattern_engine",
    "crates/terminal",
    "crates/brain",
    "crates/mcp_server",
    "crates/visualizer",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["DialectForge LLC"]
license = "Apache-2.0"

[workspace.dependencies]
# DF Core is THE dependency - everything imports it
df_core = { path = "crates/df_core" }
graph = { path = "crates/graph" }
pattern_engine = { path = "crates/pattern_engine" }
brain = { path = "crates/brain" }

# Shared deps
sha2 = "0.10"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# PDF extraction
pdf-extract = "0.7"

# Web browsing (Lu's research engine)
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
scraper = "0.22"
url = "2"
urlencoding = "2"

# Image decoding
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

# Audio decoding (WAV)
hound = "3.5"

# GUI
eframe = "0.31"
egui = "0.31"

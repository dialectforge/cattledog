[package]
license = "Apache-2.0"
name = "lu-desktop"
version = "0.1.0"
edition = "2021"
description = "Lu Brain v2 Desktop UI — Tauri shell"

[lib]
name = "lu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
brain        = { path = "../../brain" }
graph        = { path = "../../graph" }
df_core      = { path = "../../df_core" }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
chrono       = { workspace = true }

[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lu Brain v2 — Training Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', system-ui, -apple-system, monospace;
      padding: 24px;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #6e7681;
      margin-bottom: 28px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6e7681;
      flex-shrink: 0;
    }
    .dot.waiting  { background: #6e7681; }
    .dot.starting { background: #d29922; animation: pulse 1.2s infinite; }
    .dot.training { background: #1f6feb; animation: pulse 1.2s infinite; }
    .dot.complete { background: #3fb950; }
    .dot.error    { background: #f85149; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .book-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 18px 20px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .book-card.active  { border-color: #1f6feb; }
    .book-card.done    { border-color: #3fb950; }
    .book-card.error   { border-color: #f85149; }

    .book-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .book-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f0f6fc;
      word-break: break-word;
    }

    .book-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      margin-left: 12px;
    }
    .badge-queued   { background: #21262d; color: #6e7681; }
    .badge-training { background: #1f3a5f; color: #58a6ff; }
    .badge-done     { background: #1b3a26; color: #3fb950; }
    .badge-error    { background: #3d1515; color: #f85149; }

    .progress-bar-wrap {
      background: #21262d;
      border-radius: 4px;
      height: 6px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: #1f6feb;
      transition: width 0.5s ease;
    }
    .progress-bar-fill.done { background: #3fb950; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }

    .stat-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f0f6fc;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.7rem;
      color: #6e7681;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .log-area {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 16px;
      margin-top: 20px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.78rem;
      color: #8b949e;
      max-height: 200px;
      overflow-y: auto;
    }

    .log-line { margin-bottom: 3px; }
    .log-line.info  { color: #58a6ff; }
    .log-line.ok    { color: #3fb950; }
    .log-line.warn  { color: #d29922; }
    .log-line.error { color: #f85149; }

    .elapsed-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #6e7681;
      margin-top: 8px;
    }

    #footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: #21262d;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>Lu Brain v2 — Training Dashboard</h1>
<p class="subtitle">Real-time ingestion progress &nbsp;·&nbsp; polling every 2s</p>

<div class="status-bar">
  <div class="dot" id="status-dot"></div>
  <span id="status-text">Connecting to server...</span>
  <span style="margin-left:auto;font-size:0.75rem;color:#6e7681" id="poll-time"></span>
</div>

<div id="books-container"></div>

<div class="log-area" id="log"></div>

<div id="footer">Lu Brain v2 · Training Dashboard · localhost:8080</div>

<script>
  const POLL_MS = 2000;
  let lastState = null;
  let logs = [];
  const MAX_LOGS = 80;

  function addLog(msg, type = '') {
    const now = new Date().toLocaleTimeString('en-US', { hour12: false });
    logs.push({ t: now, msg, type });
    if (logs.length > MAX_LOGS) logs.shift();
    renderLog();
  }

  function renderLog() {
    const el = document.getElementById('log');
    el.innerHTML = logs.map(l =>
      `<div class="log-line ${l.type}">[${l.t}] ${escHtml(l.msg)}</div>`
    ).join('');
    el.scrollTop = el.scrollHeight;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtNum(n) {
    return Number(n || 0).toLocaleString();
  }

  function fmtTime(secs) {
    if (!secs || secs < 0) return '—';
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60);
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  function badgeClass(status) {
    switch (status) {
      case 'queued':   return 'badge-queued';
      case 'training': return 'badge-training';
      case 'done':     return 'badge-done';
      case 'error':    return 'badge-error';
      default:         return 'badge-queued';
    }
  }

  function cardClass(status) {
    switch (status) {
      case 'training': return 'active';
      case 'done':     return 'done';
      case 'error':    return 'error';
      default:         return '';
    }
  }

  function estimateProgress(book) {
    // We don't know total paragraphs upfront, show 0–99% while training
    if (book.status === 'done') return 100;
    if (book.status === 'queued') return 0;
    // Rough estimate based on page number (assume ~300 pages)
    const est = Math.min(99, Math.round((book.page || 0) / 3));
    return Math.max(1, est);
  }

  function renderBooks(data) {
    const container = document.getElementById('books-container');
    const books = data.books || [];
    const elapsed = data.started_at ? Math.round(Date.now() / 1000 - data.started_at) : 0;

    container.innerHTML = books.map((book, idx) => {
      const pct = estimateProgress(book);
      const fillClass = book.status === 'done' ? 'done' : '';
      return `
        <div class="book-card ${cardClass(book.status)}">
          <div class="book-header">
            <div class="book-name">${escHtml(book.name)}</div>
            <div class="book-badge ${badgeClass(book.status)}">${book.status}</div>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill ${fillClass}" style="width:${pct}%"></div>
          </div>
          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-value">${fmtNum(book.paragraphs)}</div>
              <div class="stat-label">Paragraphs</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">${fmtNum(book.ku_count)}</div>
              <div class="stat-label">KUs Learned</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">${(book.rate || 0).toFixed(1)}</div>
              <div class="stat-label">Para/sec</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">${fmtNum(book.errors)}</div>
              <div class="stat-label">Errors</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">${fmtNum(book.page)}</div>
              <div class="stat-label">Page</div>
            </div>
          </div>
          ${book.status === 'training' ? `<div class="elapsed-bar"><span>Elapsed: ${fmtTime(elapsed)}</span><span>~${pct}% complete (est.)</span></div>` : ''}
        </div>
      `;
    }).join('');
  }

  function updateStatus(data) {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    const status = data.status || 'waiting';
    dot.className = `dot ${status}`;

    const totalPara = (data.books || []).reduce((s, b) => s + (b.paragraphs || 0), 0);
    const totalKU   = (data.books || []).reduce((s, b) => s + (b.ku_count || 0), 0);

    const msgs = {
      waiting:  'Waiting for training to start...',
      starting: 'Starting MCP server and loading brain...',
      training: `Training in progress — ${fmtNum(totalPara)} paragraphs ingested, ${fmtNum(totalKU)} KUs learned`,
      complete: `Training complete — ${fmtNum(totalPara)} paragraphs, ${fmtNum(totalKU)} KUs total`,
      error:    `Error: ${data.error || 'unknown error'}`,
    };
    text.textContent = msgs[status] || status;
  }

  function detectChanges(prev, curr) {
    if (!prev) {
      addLog(`Connected. Status: ${curr.status}`, 'info');
      return;
    }
    if (prev.status !== curr.status) {
      addLog(`Status changed: ${prev.status} → ${curr.status}`, 'info');
    }
    (curr.books || []).forEach((book, i) => {
      const old = (prev.books || [])[i];
      if (!old) return;
      if (old.status !== book.status) {
        addLog(`${book.name}: ${old.status} → ${book.status}`, book.status === 'done' ? 'ok' : 'info');
      }
      if (book.status === 'training' && book.paragraphs > 0 && book.paragraphs % 100 === 0 && old.paragraphs !== book.paragraphs) {
        addLog(`${book.name}: ${fmtNum(book.paragraphs)} paragraphs, ${fmtNum(book.ku_count)} KUs @ ${book.rate.toFixed(1)}/s`);
      }
    });
    if (curr.status === 'complete' && prev.status !== 'complete') {
      const totalKU = (curr.books || []).reduce((s, b) => s + (b.ku_count || 0), 0);
      addLog(`All training complete! Total KUs: ${fmtNum(totalKU)}`, 'ok');
    }
  }

  async function poll() {
    try {
      const res = await fetch('/progress?t=' + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      detectChanges(lastState, data);
      lastState = data;

      updateStatus(data);
      renderBooks(data);

      document.getElementById('poll-time').textContent =
        'Last update: ' + new Date().toLocaleTimeString();

    } catch (err) {
      document.getElementById('status-text').textContent = 'Cannot reach server — retrying...';
      document.getElementById('status-dot').className = 'dot error';
      addLog('Poll error: ' + err.message, 'error');
    }
  }

  // Initial log
  addLog('Dashboard loaded, polling /progress...', 'info');

  // Start polling
  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
